services:
  # Node.js Express Backend API (Connecting to Neon PostgreSQL)
  - type: web
    name: safe-solutions-backend
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && node server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: DATABASE_URL
        value: postgresql://neondb_owner:npg_ijM05tOdoWcQ@ep-flat-block-ay3xxqz0-pooler.c-5.us-east-2.aws.neon.tech/neondb?sslmode=require
      - key: JWT_SECRET
        value: safe-solutions-jwt-secret-2024-change-in-production
      - key: JWT_REFRESH_SECRET
        value: safe-solutions-refresh-secret-2024
